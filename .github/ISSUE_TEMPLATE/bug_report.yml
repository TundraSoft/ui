name: Bug Report
description: Something is broken in @tundralibs/ui
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part is affected?
      options:
        - Component (markup / CSS / behaviour script)
        - Layout
        - Templates (core / layout / errors) or rAPId integration
        - Charts (ApexCharts)
        - Theming / tokens / dark mode
        - Icons
        - Build, CDN bundle, npm or JSR package
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component or layout name
      description: The export or CSS class, if one is involved.
      placeholder: e.g. Combobox, .data-table, SidebarLayout
  - type: input
    id: version
    attributes:
      label: Version
      description: The @tundralibs/ui version (from deno.json, package.json or the CDN URL).
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: usage
    attributes:
      label: How is it used?
      options:
        - rAPId app (JSR templates + CDN bundle)
        - rAPId app (JSR templates + self-hosted bundle)
        - Plain HTML with the CDN bundle (no rAPId)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: Include the version. If it only happens without JavaScript or under a strict CSP, say so.
      placeholder: e.g. Chrome 141 on macOS 26, Safari 26 on iOS 26
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Server runtime (if templates are involved)
      placeholder: e.g. deno 2.9.6, node 22.12, bun 1.3
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal markup, template call or app route that triggers the bug. A page under the demo catalogue (`deno task build:demos`) is ideal.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead. Include console errors and a screenshot for visual bugs.
    validations:
      required: true
