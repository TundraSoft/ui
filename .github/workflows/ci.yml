name: CI

# Runs on every branch push. The pull_request trigger exists for FORK
# PRs only (their push events fire in the fork); same-repo PRs are
# satisfied by the push run on the head commit, and the per-job `if`
# skips the duplicate pull_request run.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The browser suites run against the runner's own Chrome, with every
  # third-party host blocked (fonts, placeholder images) so a flaky
  # origin can never fail CI. cdn.jsdelivr.net stays reachable because
  # the CDN asset path is itself under test.
  CHROME_PATH: /usr/bin/google-chrome
  HERMETIC: "1"

jobs:
  quality:
    name: Format, lint, type-check, publish dry-run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Build (css, js, version manifest)
        run: deno task build

      - name: Version manifest drift
        # version.ts is generated from deno.json + the built dist/ and is
        # committed (the core template imports it). A stale manifest means
        # a release would ship the wrong SRI hashes.
        run: git diff --exit-code -- version.ts

      - name: Type check
        run: deno task check

      - name: Reference docs drift
        # docs/reference/*.md are generated from the sources by `deno task docs`
        # and committed; a stale page means the reference lags the code.
        run: |
          deno task docs
          git diff --exit-code -- docs/reference docs/Reference.md

      - name: JSR publish dry-run (slow types, metadata, file set)
        run: deno publish --dry-run

      - name: npm pack dry-run (dist/ is what jsDelivr serves)
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          grep -q 'dist/ui.css' pack.log && grep -q 'dist/ui.js' pack.log

  audit:
    name: Dependency audit (high+)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Audit dependencies
        # Fails only on high/critical; the weekly health run reports all
        # severities and files an issue.
        run: deno audit --level=high

  browser:
    name: Browser suites (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deno
            runtime: deno
          - name: node
            runtime: node
          - name: bun
            runtime: bun
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Setup Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install (node)
        if: matrix.runtime == 'node'
        run: npm install --no-audit --no-fund

      - name: Install (bun)
        if: matrix.runtime == 'bun'
        run: bun install

      # `deno task test` / `npm test` / `bun run bun:test` each build the
      # bundle, generate the demo pages, then run every suite: the catalogue,
      # layouts at six viewport bands, every demo page light+dark, the
      # admin demo's interactions, and the rAPId example app end to end.
      - name: Build, demos and every browser suite (deno)
        if: matrix.runtime == 'deno'
        run: deno task test

      - name: Build, demos and every browser suite (node)
        if: matrix.runtime == 'node'
        run: npm test

      - name: Build, demos and every browser suite (bun)
        if: matrix.runtime == 'bun'
        run: bun run bun:test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots-${{ matrix.name }}
          path: .test-output/
          if-no-files-found: ignore
          retention-days: 7
