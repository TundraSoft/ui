name: Weekly Health

# Drift detection: nothing in the repo changed, but the world did — a new
# runtime release, a new rAPId release, a new Chrome, a newly published
# CVE, or the CDN copy of the bundle. Runs a broader matrix than PR CI
# and files/updates a tracking issue on failure (closes it on the next
# green run). Same shape as TundraLibs' health workflow.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CHROME_PATH: /usr/bin/google-chrome
  HERMETIC: "1"

jobs:
  drift:
    name: Runtime drift (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deno-stable
            runtime: deno
            version: v2.x
          - name: deno-canary
            runtime: deno
            version: canary
          - name: bun-latest
            runtime: bun
            version: latest
          - name: node-22
            runtime: node
            version: 22.x
          - name: node-24
            runtime: node
            version: 24.x
          - name: node-current
            runtime: node
            version: current
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: ${{ matrix.version }}

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.version }}

      - name: Setup Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.version }}

      - name: Install (node)
        if: matrix.runtime == 'node'
        run: npm install --no-audit --no-fund

      - name: Install (bun)
        if: matrix.runtime == 'bun'
        run: bun install

      - name: Build, demos and every browser suite (deno)
        if: matrix.runtime == 'deno'
        run: deno task test

      - name: Build, demos and every browser suite (node)
        if: matrix.runtime == 'node'
        run: npm test

      - name: Build, demos and every browser suite (bun)
        if: matrix.runtime == 'bun'
        run: bun run bun:test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: health-screenshots-${{ matrix.name }}
          path: .test-output/
          if-no-files-found: ignore
          retention-days: 14

  rapid-canary:
    name: rAPId canary (@latest instead of the pin)
    runs-on: ubuntu-latest
    # The pin in deno.json is what consumers get. This job unpins rAPId and
    # compat to the latest published versions and re-runs the type check
    # and the example-app suite, so a breaking rAPId release is noticed
    # before a consumer upgrades — not after.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Unpin rAPId and compat to @latest
        run: |
          deno run -A scripts/unpin.ts
          rm -f deno.lock
          git diff --stat -- deno.json

      - name: Resolved versions
        run: deno info jsr:@tundralibs/rapid | head -n 3

      - name: Build
        run: deno task build

      - name: Type check against @latest
        run: deno task check

      - name: Example app end to end against @latest
        run: deno task test:app

  audit:
    name: Full dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Audit (all severities)
        run: deno audit

  cdn:
    name: CDN assets match the manifest
    runs-on: ubuntu-latest
    # Only meaningful once a version has been published to npm: the job
    # fetches the jsDelivr URLs from version.ts and checks the bytes hash to
    # the SRI values the core template emits. Skips (green) while the
    # version is 0.0.0 — nothing is published yet.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Verify published bundle integrity
        run: deno run -A scripts/check-cdn.ts

  close-on-success:
    name: Close health issue on a green run
    needs: [drift, rapid-canary, audit, cdn]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close any open health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label ci-health --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Resolved — this run passed: ${RUN_URL}"
            echo "Closed issue #$existing"
          else
            echo "No open health issue to close"
          fi

  report:
    name: File issue on failure
    needs: [drift, rapid-canary, audit, cdn]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Create or update health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRIFT: ${{ needs.drift.result }}
          CANARY: ${{ needs.rapid-canary.result }}
          AUDIT: ${{ needs.audit.result }}
          CDN: ${{ needs.cdn.result }}
        run: |
          # Title must match the frontmatter `title` in the issue template.
          title="Weekly health check failed"
          # Body is the shared issue template with its frontmatter stripped —
          # single source of truth in .github/ISSUE_TEMPLATE/ci_health.md.
          template=".github/ISSUE_TEMPLATE/ci_health.md"
          body="$(awk 'f>=2{print; next} /^---[[:space:]]*$/{f++}' "$template")"

          failing=""
          [ "$DRIFT" = "failure" ] && failing="$failing runtime-drift"
          [ "$CANARY" = "failure" ] && failing="$failing rapid-canary"
          [ "$AUDIT" = "failure" ] && failing="$failing dependency-audit"
          [ "$CDN" = "failure" ] && failing="$failing cdn-assets"
          [ -z "$failing" ] && failing=" (see run)"

          body="${body}

          **Failing job(s):**${failing}
          **Run:** ${RUN_URL}"

          existing=$(gh issue list --label ci-health --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing —${failing}: ${RUN_URL}"
            echo "Updated issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label ci-health
            echo "Created new health issue"
          fi
